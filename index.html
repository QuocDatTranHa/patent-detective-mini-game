<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patent Detective</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══════════════════════════════════════
       Screen 1: Start
  ════════════════════════════════════════ -->
  <div id="screen-start">
    <img src="assets/backgrounds/start-screen.png" alt="" aria-hidden="true" class="screen-bg">
    <div id="start-title-intro" data-text="startTitleIntro"></div>
    <div id="start-intro" data-text="startIntro"></div>
    <div id="start-title-disclosure" data-text="startTitleDisclosure"></div>
    <div id="start-disclosure" data-text="startDisclosure"></div>
    <div id="hotspot-start-disclosure" class="hotspot start-hotspot"></div>
    <button id="btn-start" data-text="start">Start</button>
  </div>

  <!-- ═══════════════════════════════════════
       Screen 2: Game
  ════════════════════════════════════════ -->
  <div id="screen-game" class="hidden">
    <img src="assets/backgrounds/game-screen.png" alt="" aria-hidden="true" class="screen-bg">
    <div id="hotspot-layer">
      <!-- Item hotspots (0–9) are injected here dynamically by script.js in Phase 5 -->
      <div id="hotspot-safe" class="hotspot"></div>
      <div id="hotspot-safe-bubble" class="hotspot"></div>
    </div>
    <button id="btn-menu">&#9776;</button>
  </div>

  <!-- ═══════════════════════════════════════
       Screen 3: Win
  ════════════════════════════════════════ -->
  <div id="screen-win" class="hidden">
    <img src="assets/backgrounds/win-screen.png" alt="" aria-hidden="true" class="screen-bg">
    <p id="win-message" data-text="win">Glückwunsch!</p>
    <div id="win-text" data-text="winText"></div>
    <button id="btn-restart-win" data-text="replay">Neu starten</button>
  </div>

  <!-- ═══════════════════════════════════════
       Overlay — shared; blocks all background
       interactions while any modal is open
  ════════════════════════════════════════ -->
  <div id="overlay" class="hidden"></div>

  <!-- UI layer — mirrors screen dimensions; language button always visible -->
  <div id="ui-layer">
    <button id="btn-language">
      <img id="flag-icon" src="assets/ui/flag-de.svg" alt="Sprache wechseln">
    </button>
  </div>

  <!-- ═══════════════════════════════════════
       Modal: Item (large)
       Closes via btn-close only (NOT overlay)
  ════════════════════════════════════════ -->
  <div id="modal-item" class="modal hidden">
    <img id="modal-item-image" src="" alt="">
    <div id="modal-item-text">
      <h2 id="modal-item-title"></h2>
      <p id="modal-item-body"></p>
      <div id="modal-item-nav" class="hidden">
        <button id="modal-prev">&#60;</button>
        <button id="modal-next">&#62;</button>
      </div>
      <span id="modal-item-digit" class="hidden"></span>
    </div>
    <button class="btn-close">&#10005;</button>
  </div>

  <!-- ═══════════════════════════════════════
       Modal: Safe (medium-to-large)
       Closes via btn-close only (NOT overlay)
  ════════════════════════════════════════ -->
  <div id="modal-safe" class="modal hidden">
    <!-- Background artwork fills the 16:9 window -->
    <img id="modal-safe-bg" src="assets/clues/safe-background.png" alt="" aria-hidden="true">

    <!-- Digit readouts overlaid on the drawn number boxes -->
    <span class="digit-display" data-index="0">0</span>
    <span class="digit-display" data-index="1">0</span>
    <span class="digit-display" data-index="2">0</span>
    <span class="digit-display" data-index="3">0</span>

    <!-- Invisible hitbox container; click events bubble to JS listener -->
    <div id="safe-digits">
      <button class="arrow-up"   data-index="0"></button>
      <button class="arrow-up"   data-index="1"></button>
      <button class="arrow-up"   data-index="2"></button>
      <button class="arrow-up"   data-index="3"></button>
      <button class="arrow-down" data-index="0"></button>
      <button class="arrow-down" data-index="1"></button>
      <button class="arrow-down" data-index="2"></button>
      <button class="arrow-down" data-index="3"></button>
    </div>

    <!-- Invisible hitbox over the drawn ENTER button -->
    <button id="btn-confirm"></button>

    <!-- Error feedback -->
    <p id="safe-error" class="hidden" data-text="error">Der Code ist nicht korrekt.</p>

    <button class="btn-close">&#10005;</button>
  </div>

  <!-- ═══════════════════════════════════════
       Modal: Menu (small)
       Closes via btn-close OR overlay click
  ════════════════════════════════════════ -->
  <div id="modal-menu" class="modal hidden">
    <img id="modal-menu-bg" src="assets/ui/menu-background.png" alt="" aria-hidden="true">
    <button id="btn-restart-menu"></button>
    <button class="btn-close">&#10005;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
