<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30">
  <!-- Dark navy background -->
  <rect width="60" height="30" fill="#020B22"/>
  <!-- Diagonal crosses: neon cyan (St. Andrew / St. Patrick) -->
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#00E5FF" stroke-width="8"/>
  <!-- Diagonal red offset (St. Patrick) -->
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#FF0044" stroke-width="5"/>
  <!-- Centre cross: neon cyan (St. George white) -->
  <path d="M30,0 V30 M0,15 H60" stroke="#00E5FF" stroke-width="12"/>
  <!-- Centre cross: neon red (St. George red) -->
  <path d="M30,0 V30 M0,15 H60" stroke="#FF0044" stroke-width="7"/>
  <!-- Neon cyan frame -->
  <rect width="60" height="30" fill="none" stroke="#00F0FF" stroke-width="2"/>
</svg>
